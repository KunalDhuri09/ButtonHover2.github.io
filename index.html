<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CWA Courses</title>

<style>

:root{
--accent:#f97316;
--accent-soft:#fff3e8;
--border:#e6e6e6;
--text:#0f172a;
--text-soft:#64748b;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
}

body{
background:#fff7ed;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:30px;
}

/* CONTAINER */

.selector{
max-width:1050px;
width:100%;
background:#fff;
border-radius:22px;
padding:40px;
box-shadow:
0 20px 60px rgba(0,0,0,.08),
0 6px 18px rgba(0,0,0,.05);
}

/* TITLE */

.selector h2{
font-size:28px;
font-weight:600;
margin-bottom:28px;
color:var(--text);
}

/* TABS */

.tabs{
display:flex;
gap:10px;
margin-bottom:28px;
overflow-x:auto;
padding-bottom:6px;
}

.tabs::-webkit-scrollbar{display:none;}

.tab{
border:1px solid var(--border);
background:#fafafa;
padding:10px 16px;
border-radius:999px;
font-size:14px;
cursor:pointer;
white-space:nowrap;
transition:.25s;
}

.tab.active{
background:var(--accent-soft);
border-color:var(--accent);
color:var(--accent);
font-weight:500;
}

/* CARD AREA */

.slider{
position:relative;
overflow:hidden;
min-height:320px;
}

.card{
position:absolute;
inset:0;
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:34px;
display:flex;
flex-direction:column;
gap:18px;
opacity:0;
transform:translateX(40px);
transition:.5s cubic-bezier(.4,0,.2,1);
}

.card.active{
opacity:1;
transform:none;
position:relative;
}

/* HEADER */

.card-top{
display:flex;
align-items:center;
gap:16px;
}

.icon{
width:58px;
height:58px;
border-radius:14px;
background:var(--accent-soft);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
}

.title{
font-size:20px;
font-weight:600;
color:var(--text);
}

.sub{
font-size:14px;
color:var(--text-soft);
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:6px;
}

.stat{
background:#fafafa;
padding:14px;
border-radius:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:20px;
color:var(--accent);
}

.stat span{
font-size:12px;
color:var(--text-soft);
}

/* DESC */

.desc{
font-size:15px;
line-height:1.6;
color:var(--text-soft);
}

/* HIGHLIGHTS */

.hl{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:4px;
}

.hl div{
display:flex;
gap:8px;
font-size:14px;
color:var(--text-soft);
}

.hl span{
color:var(--accent);
}

/* BUTTON */

.btn{
margin-top:8px;
align-self:flex-start;
background:var(--accent);
color:white;
border:none;
padding:11px 18px;
border-radius:10px;
font-size:14px;
cursor:pointer;
transition:.2s;
}

.btn:hover{
background:#ea6a0a;
}

/* NAV */

.nav{
display:flex;
justify-content:space-between;
margin-top:18px;
}

.nav button{
border:1px solid var(--border);
background:white;
padding:9px 16px;
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.nav button:hover{
background:#fafafa;
}

/* MOBILE */

@media(max-width:720px){

.selector{
padding:28px;
}

.stats{
grid-template-columns:1fr 1fr;
}

.hl{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="selector">

<h2>Explore Our Courses</h2>

<div class="tabs" id="tabs"></div>

<div class="slider" id="slider"></div>

</div>

<script>

const courses=[
{
icon:"📘",
name:"Class 11 Commerce",
sub:"Foundation Year",
stats:[["6","Subjects"],["3×","Weekly tests"],["2h","Daily class"]],
desc:"Build a strong commerce foundation with concept-based teaching and regular practice tests.",
hl:["Concept clarity","Weekly quizzes","Expert faculty","Board exam prep"]
},
{
icon:"📗",
name:"Class 12 Commerce",
sub:"Board Year",
stats:[["6","Subjects"],["5×","Mock tests"],["98%","Pass rate"]],
desc:"Complete board preparation with revision modules, mock exams and expert guidance.",
hl:["Board preparation","Mock test series","Rapid revision","Mentoring support"]
},
{
icon:"📙",
name:"CA Foundation",
sub:"Entry Level",
stats:[["4","Papers"],["6mo","Duration"],["1:1","Mentorship"]],
desc:"Kickstart your CA journey with deep concept clarity and structured practice tests.",
hl:["Concept clarity","Practice papers","Mentorship","Study material"]
},
{
icon:"📕",
name:"CA Intermediate",
sub:"Advanced Level",
stats:[["8","Papers"],["15+","Case studies"],["Expert","Faculty"]],
desc:"Advanced preparation with case studies, test series and revision bootcamps.",
hl:["Advanced accounting","Case training","Test series","Revision bootcamp"]
}
]

let current=0

function render(){

const tabs=document.getElementById("tabs")
const slider=document.getElementById("slider")

tabs.innerHTML=courses.map((c,i)=>`
<div class="tab ${i===current?'active':''}" onclick="switchCourse(${i})">
${c.name}
</div>`).join("")

slider.innerHTML=courses.map((c,i)=>`
<div class="card ${i===current?'active':''}">

<div class="card-top">
<div class="icon">${c.icon}</div>
<div>
<div class="title">${c.name}</div>
<div class="sub">${c.sub}</div>
</div>
</div>

<div class="stats">
${c.stats.map(s=>`
<div class="stat">
<strong>${s[0]}</strong>
<span>${s[1]}</span>
</div>`).join("")}
</div>

<p class="desc">${c.desc}</p>

<div class="hl">
${c.hl.map(h=>`<div><span>✓</span>${h}</div>`).join("")}
</div>

<div class="nav">
<button onclick="switchCourse(${current-1})" ${current===0?'disabled':''}>← Previous</button>
<button onclick="switchCourse(${current+1})" ${current===courses.length-1?'disabled':''}>Next →</button>
</div>

</div>
`).join("")

}

function switchCourse(i){
if(i<0||i>=courses.length)return
current=i
render()
}

render()

</script>

</body>
</html>
